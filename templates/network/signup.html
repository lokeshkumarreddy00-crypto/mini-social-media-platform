{% extends "base.html" %}
{% block title %}Sign up · Connectly{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1>
  <p class="muted">Join the conversation.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="primary full" type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
</section>
{% endblock %}
